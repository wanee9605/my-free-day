<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F1F1EF; --surface:#FCFCFB; --field:#FFFFFF; --line:#D9D9D4; --line-soft:#E6E6E1;
  --text:#1E1F1E; --text-2:#484A48; --text-3:#75776F; --text-4:#A0A29A;
  --acc:#1F6F5C; --acc-ink:#14503F; --acc-soft:rgba(31,111,92,0.14); --acc-mid:rgba(31,111,92,0.38);
  --run:#E4E4DE; --run-line:#C9C9C1; --tick:#DEDED8;
}
:root[data-theme="dark"]{
  --bg:#101211; --surface:#171A18; --field:#1D211F; --line:#2B302D; --line-soft:#232725;
  --text:#EDEEEB; --text-2:#B2B5B0; --text-3:#82867F; --text-4:#5C605A;
  --acc:#5BB79C; --acc-ink:#8ED6BE; --acc-soft:rgba(91,183,156,0.18); --acc-mid:rgba(91,183,156,0.45);
  --run:#242A27; --run-line:#333A36; --tick:#222724;
}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;text-wrap:pretty}
*{box-sizing:border-box}
a{color:var(--acc);text-decoration:none}
a:hover{color:var(--acc-ink)}
button{font-family:inherit;font-variant-numeric:tabular-nums;cursor:pointer}
</style>
</helmet>

<div style="min-height:100vh;background:var(--bg)">

  <header style="display:flex;align-items:center;justify-content:space-between;gap:12px;height:46px;padding:0 14px;background:var(--bg);border-bottom:1px solid var(--line)">
    <div style="display:flex;align-items:baseline;gap:7px;min-width:0">
      <span style="font-size:13px;font-weight:600;letter-spacing:-0.01em">2027 연차 효율 곡선</span>
      <span style="font-size:12px;font-weight:500;color:var(--text-3)">{{ headerStat }}</span>
    </div>
    <button onClick="{{ toggleTheme }}" style="height:28px;padding:0 10px;font-size:12px;font-weight:500;color:var(--text-2);background:var(--surface);border:1px solid var(--line);border-radius:5px">{{ themeLabel }}</button>
  </header>

  <div style="max-width:1180px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:14px">

    <section style="display:flex;flex-direction:column;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px">
      <div style="display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px">
        <span style="font-size:12px;font-weight:600;color:var(--text-2)">연차를 몇 개 쓸까 — 막대를 눌러 비교하세요</span>
        <span style="font-size:12px;font-weight:500;color:var(--text-3)">{{ marginalNote }}</span>
      </div>
      <div style="display:flex;align-items:flex-end;gap:2px;height:118px">
        <sc-for list="{{ bars }}" as="b" hint-placeholder-count="20">
          <button onClick="{{ b.onClick }}" title="{{ b.title }}" style="{{ b.style }}"><span style="{{ b.capStyle }}">{{ b.cap }}</span></button>
        </sc-for>
      </div>
      <div style="display:flex;gap:2px">
        <sc-for list="{{ bars }}" as="b" hint-placeholder-count="20">
          <span style="{{ b.axisStyle }}">{{ b.axis }}</span>
        </sc-for>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:6px;overflow:hidden">
        <sc-for list="{{ stats }}" as="s" hint-placeholder-count="4">
          <div style="flex:1 1 120px;display:flex;flex-direction:column;gap:3px;padding:10px 12px;background:var(--surface)">
            <span style="font-size:11.5px;font-weight:500;color:var(--text-3)">{{ s.k }}</span>
            <span style="{{ s.vStyle }}">{{ s.v }}</span>
          </div>
        </sc-for>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:10px">
        <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:12px;font-weight:500;color:var(--text-3)">{{ g.label }}</span>
            <div style="display:flex;padding:2px;background:var(--bg);border:1px solid var(--line-soft);border-radius:5px">
              <sc-for list="{{ g.opts }}" as="o" hint-placeholder-count="3">
                <button onClick="{{ o.onClick }}" style="{{ o.style }}">{{ o.label }}</button>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </section>

    <section style="display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto">
      <span style="font-size:12px;font-weight:600;color:var(--text-2)">1년 전체를 한 줄로</span>
      <div style="min-width:900px;display:flex;flex-direction:column;gap:6px">
        <div style="position:relative;height:40px">
          <div style="position:absolute;inset:0;display:flex;gap:0">
            <sc-for list="{{ ticks }}" as="t" hint-placeholder-count="365">
              <span style="{{ t.style }}"></span>
            </sc-for>
          </div>
          <sc-for list="{{ capsules }}" as="c" hint-placeholder-count="4">
            <div onMouseEnter="{{ c.onEnter }}" onMouseLeave="{{ c.onLeave }}" style="{{ c.style }}"><span style="{{ c.labelStyle }}">{{ c.label }}</span></div>
          </sc-for>
        </div>
        <div style="display:flex">
          <sc-for list="{{ monthAxis }}" as="m" hint-placeholder-count="12">
            <span style="{{ m.style }}">{{ m.label }}</span>
          </sc-for>
        </div>
      </div>
    </section>

    <section style="display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden">
      <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line)">
        <span style="width:24px;flex:none;font-size:11px;font-weight:500;color:var(--text-4)">#</span>
        <span style="flex:1;min-width:0;font-size:11px;font-weight:500;color:var(--text-4)">기간</span>
        <span style="width:56px;flex:none;text-align:right;font-size:11px;font-weight:500;color:var(--text-4)">쉬는 날</span>
        <span style="width:46px;flex:none;text-align:right;font-size:11px;font-weight:500;color:var(--text-4)">연차</span>
        <span style="width:40px;flex:none;text-align:right;font-size:11px;font-weight:500;color:var(--text-4)">배수</span>
      </div>
      <sc-for list="{{ picks }}" as="p" hint-placeholder-count="3">
        <div onMouseEnter="{{ p.onEnter }}" onMouseLeave="{{ p.onLeave }}" style="{{ p.rowStyle }}">
          <span style="width:24px;flex:none;font-size:12px;font-weight:500;color:var(--text-4)">{{ p.idx }}</span>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
            <span style="font-size:13px;font-weight:600;letter-spacing:-0.01em">{{ p.rangeLabel }}</span>
            <span style="font-size:11.5px;font-weight:500;line-height:1.4;color:var(--text-3)">{{ p.leaveLabel }}</span>
          </div>
          <span style="width:56px;flex:none;display:flex;align-items:baseline;justify-content:flex-end;gap:2px"><span style="font-size:20px;font-weight:600;line-height:1;letter-spacing:-0.02em">{{ p.total }}</span><span style="font-size:11px;font-weight:500;color:var(--text-3)">일</span></span>
          <span style="width:46px;flex:none;text-align:right;font-size:13px;font-weight:500;color:var(--text-2)">{{ p.cost }}일</span>
          <span style="width:40px;flex:none;text-align:right;font-size:12px;font-weight:600;color:var(--acc)">{{ p.effLabel }}</span>
        </div>
      </sc-for>
      <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
        <div style="padding:16px 12px;font-size:12px;font-weight:500;color:var(--text-3)">조건에 맞는 조합이 없습니다.</div>
      </sc-if>
    </section>

    <div style="padding-bottom:24px"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:860}}">
class Component extends DCLogic {
  state = { leave: 5, strategy: 'spread', minLen: 4, hover: -1, dark: false, core: null };
  componentDidMount() {
    this.applyTheme(false);
    import('./core.js').then(m => this.setState({ core: m }));
  }
  applyTheme(dark) { document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light'); }
  seg(v, k) {
    const on = v === k;
    return {
      height: '25px', padding: '0 9px', fontSize: '12px', fontWeight: on ? 600 : 500,
      color: on ? 'var(--text)' : 'var(--text-3)',
      background: on ? 'var(--surface)' : 'transparent',
      border: '1px solid ' + (on ? 'var(--line)' : 'transparent'), borderRadius: '4px'
    };
  }

  renderVals() {
    const st = this.state, C = st.core;
    const base = {
      themeLabel: st.dark ? '라이트' : '다크',
      toggleTheme: () => { const d = !this.state.dark; this.applyTheme(d); this.setState({ dark: d }); },
      groups: [
        { key: 'g1', label: '전략', opts: [['spread', '나눠 쓰기'], ['burst', '몰아 쓰기']].map(([v, l]) => ({ key: v, label: l, onClick: () => this.setState({ strategy: v, hover: -1 }), style: this.seg(st.strategy, v) })) },
        { key: 'g2', label: '최소 연휴', opts: [[4, '4일'], [5, '5일'], [7, '7일']].map(([v, l]) => ({ key: 'm' + v, label: l, onClick: () => this.setState({ minLen: v, hover: -1 }), style: this.seg(st.minLen, v) })) }
      ]
    };
    if (!C) return { ...base, headerStat: '', marginalNote: '', bars: [], stats: [], ticks: [], capsules: [], monthAxis: [], picks: [], isEmpty: false };

    const curve = [];
    for (let l = 1; l <= 20; l++) {
      const r = C.plan({ leave: l, strategy: st.strategy, minLen: st.minLen });
      curve.push({ l, rest: r.blocks.reduce((s, b) => s + b.total, 0), used: r.blocks.reduce((s, b) => s + b.cost, 0) });
    }
    const maxRest = curve.reduce((m, c) => Math.max(m, c.rest), 1);
    const { days, blocks } = C.plan({ leave: st.leave, strategy: st.strategy, minLen: st.minLen });
    const used = blocks.reduce((s, b) => s + b.cost, 0);
    const rest = blocks.reduce((s, b) => s + b.total, 0);
    const next = curve[st.leave] ? curve[st.leave].rest - rest : 0;
    const knee = curve.reduce((best, c, i) => {
      const gain = i === 0 ? c.rest : c.rest - curve[i - 1].rest;
      return gain >= 3 ? c.l : best;
    }, 1);

    const fmt = i => (days[i].m + 1) + '.' + days[i].d;
    const fmtD = i => fmt(i) + '(' + C.dowKo[days[i].dow] + ')';
    const N = days.length;

    const bars = curve.map(c => {
      const on = c.l === st.leave;
      const isKnee = c.l === knee;
      return {
        key: 'b' + c.l,
        title: '연차 ' + c.l + '일 → ' + c.rest + '일 휴식',
        cap: on ? String(c.rest) : isKnee ? '권장' : '',
        capStyle: { fontSize: '10.5px', fontWeight: 600, color: on ? 'var(--acc-ink)' : 'var(--text-4)', paddingBottom: '3px' },
        axis: c.l % 5 === 0 || c.l === 1 ? String(c.l) : '',
        axisStyle: { flex: 1, minWidth: 0, textAlign: 'center', fontSize: '10px', fontWeight: 500, color: 'var(--text-4)' },
        onClick: () => this.setState({ leave: c.l, hover: -1 }),
        style: {
          flex: 1, minWidth: 0, height: (14 + c.rest / maxRest * 86) + 'px',
          display: 'flex', alignItems: 'flex-start', justifyContent: 'center', padding: 0,
          background: on ? 'var(--acc-mid)' : 'var(--acc-soft)',
          border: '1px solid ' + (on ? 'var(--acc)' : isKnee ? 'var(--acc-mid)' : 'transparent'),
          borderRadius: '4px 4px 2px 2px', transition: 'height .14s, background .12s'
        }
      };
    });

    const blockOf = {};
    blocks.forEach((b, bi) => { for (let i = b.s; i <= b.e; i++) blockOf[i] = bi; });
    const ticks = days.map(d => ({
      key: d.key,
      style: {
        flex: 1, minWidth: 0, alignSelf: 'stretch',
        background: d.hol ? 'var(--acc)' : d.weekend ? 'var(--tick)' : 'transparent',
        borderRight: d.d === C.DIM[d.m] ? '1px solid var(--line-soft)' : 'none'
      }
    }));

    const capsules = blocks.map((b, bi) => {
      const active = st.hover === bi;
      return {
        key: 'c' + b.s,
        label: b.total + '일',
        labelStyle: { fontSize: '10.5px', fontWeight: 600, color: 'var(--acc-ink)', paddingLeft: '5px', whiteSpace: 'nowrap' },
        onEnter: () => this.setState({ hover: bi }),
        onLeave: () => this.setState({ hover: -1 }),
        style: {
          position: 'absolute', top: '6px', bottom: '6px',
          left: (b.s / N * 100) + '%', width: (b.total / N * 100) + '%',
          minWidth: '10px', display: 'flex', alignItems: 'center',
          background: active ? 'var(--acc-mid)' : 'var(--acc-soft)',
          border: '1px solid ' + (active ? 'var(--acc)' : 'var(--acc-mid)'),
          borderRadius: '999px', transition: 'background .12s'
        }
      };
    });

    const monthAxis = C.MONTHS.map((label, m) => ({
      key: 'a' + m, label: String(m + 1),
      style: { flex: C.DIM[m], minWidth: 0, fontSize: '10.5px', fontWeight: 500, color: 'var(--text-4)', paddingLeft: '2px' }
    }));

    const picks = blocks.map((b, bi) => {
      const active = st.hover === bi;
      return {
        key: 'p' + b.s, idx: String(bi + 1), total: String(b.total), cost: String(b.cost),
        rangeLabel: fmtD(b.s) + ' – ' + fmtD(b.e),
        leaveLabel: '연차 ' + b.leaveIdx.map(fmtD).join(', '),
        effLabel: '×' + (Math.round(b.total / b.cost * 10) / 10).toFixed(1),
        onEnter: () => this.setState({ hover: bi }),
        onLeave: () => this.setState({ hover: -1 }),
        rowStyle: {
          display: 'flex', alignItems: 'center', gap: '10px', padding: '11px 12px',
          background: active ? 'var(--bg)' : 'var(--surface)',
          borderTop: bi === 0 ? 'none' : '1px solid var(--line-soft)',
          boxShadow: active ? 'inset 2px 0 0 var(--acc)' : 'none'
        }
      };
    });

    return {
      ...base,
      headerStat: '연차 ' + used + '일 · 휴식 ' + rest + '일',
      marginalNote: next > 0 ? '연차 1일 더 쓰면 +' + next + '일' : '더 늘려도 이득이 없습니다',
      bars, ticks, capsules, monthAxis, picks,
      isEmpty: picks.length === 0,
      stats: [
        { key: 's1', k: '쓰는 연차', v: used + '일', vStyle: { fontSize: '19px', fontWeight: 600, letterSpacing: '-0.02em', color: 'var(--text)' } },
        { key: 's2', k: '총 휴식', v: rest + '일', vStyle: { fontSize: '19px', fontWeight: 600, letterSpacing: '-0.02em', color: 'var(--acc)' } },
        { key: 's3', k: '연차 1일당', v: (used ? (Math.round(rest / used * 10) / 10).toFixed(1) : '0.0') + '일', vStyle: { fontSize: '19px', fontWeight: 600, letterSpacing: '-0.02em', color: 'var(--text)' } },
        { key: 's4', k: '효율 한계점', v: '연차 ' + knee + '일', vStyle: { fontSize: '19px', fontWeight: 600, letterSpacing: '-0.02em', color: 'var(--text)' } }
      ]
    };
  }
}
</script>
</body>
</html>
